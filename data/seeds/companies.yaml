# Seed companies: the curated set that drives discovery.
#
# Adding a company here makes `npm run discover` find its games automatically
# (Wikidata "developer"/"publisher" statements, plus IGDB when configured).
# Classification is editorial: pick the closest category and explain edge
# cases in `notes`. Always set `externalIds.wikidata` when you can; it removes
# name ambiguity (e.g. "Landfall", "Evil Empire").
#
# categories: independent | independent-large | independent-publisher |
#   acquired-independent | subsidiary | AAA-adjacent | other | excluded
#
# Optional per-company fields:
#   aliases: [..]            other names providers use
#   website: https://..      only if not provided by Wikidata
#   discover: false          keep the company without running discovery
#   games: { steam: [..], wikidata: [..], igdb: [..] }  extra game hints
#   classification.include: false   keep the record but leave it out of the curated set

companies:
  - id: team-cherry
    name: Team Cherry
    roles: [developer, publisher]
    classification:
      category: independent
      notes: Small self-publishing studio in Adelaide.
    externalIds: { wikidata: Q29326164 }
    games:
      steam: [367520]

  - id: supergiant-games
    name: Supergiant Games
    roles: [developer, publisher]
    classification:
      category: independent
      notes: Self-owned; self-publishes on PC.
    externalIds: { wikidata: Q7643396 }

  - id: landfall
    name: Landfall
    aliases: [Landfall Games, Landfall Games AB]
